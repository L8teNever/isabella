name: BeatBlade-Image bauen

on:
  push:
    branches: [main]
    paths: ["beatblade/**", ".github/workflows/beatblade.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: beatblade } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: beatblade/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: beatblade/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image-Name klein schreiben
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/beatblade" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: beatblade
          push: true
          platforms: linux/amd64
          build-args: BASE_PATH=/beatblade
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:1.0.${{ github.run_number }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
