<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BeatBlade – Debug</title>
  <style>
    body { overscroll-behavior: none; }
    .ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
    .ctrl label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px; }
    #tl { width: 100%; height: 640px; display: block; background: #0f0d18; border-radius: 12px; touch-action: pan-y; cursor: crosshair; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 10px 0; }
    .stats div { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
    .stats b { display: block; font-size: 17px; }
    .legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
  </style>
</head>
<body>
  <header class="top"><div class="logo">Beat<b>Blade</b> <span class="hint">Debug</span></div>
    <nav class="tabs"><a href="./">Bibliothek</a><a id="playlink" href="./play.html">Spielen ▸</a></nav></header>
  <main style="max-width:1400px">
    <h2 id="title">…</h2>
    <div class="ctrl">
      <button id="play" class="primary">▶ Abspielen</button>
      <label><input type="checkbox" id="click" checked /> Metronom</label>
      <label><input type="checkbox" id="nclick" /> Noten-Klick</label>
      <label>Schwierigkeit <select id="diff"></select></label>
      <label>Seed <input id="seed" type="number" min="0" style="width:100px" /></label>
      <button id="load">Laden</button>
      <label>Zoom <input id="zoom" type="range" min="4" max="60" value="16" /></label>
      <span id="time" class="hint"></span>
    </div>
    <canvas id="tl"></canvas>
    <div class="legend">
      <span><i style="background:#ff3d6e"></i>Rot (links)</span><span><i style="background:#3db8ff"></i>Blau (rechts)</span>
      <span><i style="background:#888"></i>Bombe</span><span><i style="background:rgba(255,200,80,.5)"></i>Wand</span>
      <span>Bänder: Sub · Low-Mid · High-Mid · High</span><span>Klick in die Zeitleiste = springen</span>
    </div>
    <div class="stats" id="stats"></div>
    <h3>Job-Log</h3><pre class="log" id="log"></pre>
  </main>
  <script type="module" src="./src/pages/debug.ts"></script>
</body>
</html>
